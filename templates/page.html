{% extends "base.html" %}

{% block title %}{{ page.title }} &bull; {{ config.title }}{% endblock title %}

{% block content %}
<h1>{{ page.title }}</h1>
{% if page.date %}
<p class="post-meta">Published: {{ page.date | date(format="%Y-%m-%d") }}</p>
{% endif %}

<article>
    {{ page.content | safe }}
</article>
{% endblock content %}
